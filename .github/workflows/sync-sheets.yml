name: Sync Google Drive Data & Redeploy

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically every hour
  workflow_dispatch:     # Allows you to click a button to run it manually anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Contacts & Expenses CSVs
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1l50Vrz9V5yu3YLZ7lZSlPvZinjPd4n7GXXhTnCGzdw0/export?format=csv&gid=0" -o contacts.csv
          curl -L "https://docs.google.com/spreadsheets/d/1l50Vrz9V5yu3YLZ7lZSlPvZinjPd4n7GXXhTnCGzdw0/export?format=csv&gid=632803751" -o expenses.csv

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contacts.csv expenses.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync latest Google Sheet data" && git push)
